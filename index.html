<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>RevanStore • Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <style>
        :root {
            --white: #FFFFFF;
            --sky: #00BFFF;
            --sky-hover: #0099CC;
            --bg-section: #F8F9FA;
            --text-primary: #1E293B;
            --text-secondary: #6C757D;
            --border-light: #E2E8F0;
            --border-input: #CBD5E1;
            --red: #EF4444;
            --red-soft: #FEE2E2;
            --red-text: #B91C1C;
            --green: #10B981;
            --green-soft: #DCFCE7;
            --green-text: #065F46;
            --orange: #F97316;
            --orange-soft: #FFEDD5;
            --orange-text: #C2410C;
            --yellow: #F59E0B;
            --yellow-soft: #FEF3C7;
            --yellow-text: #92400E;
            --sky-soft: #F0F9FF;
            --shadow-subtle: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-modal: 0 20px 60px rgba(0, 0, 0, 0.08);
            --radius-2xl: 24px;
            --radius-xl: 16px;
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --radius-xs: 4px;
            --radius-full: 9999px;
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
            --font-heading: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
            --transition-fast: 0.2s ease;
            --transition-smooth: 0.25s ease-in-out;
            --space-xs: 0.4rem;
            --space-sm: 0.6rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2rem;
            --space-2xl: 2.5rem;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-section);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
            line-height: 1.5;
            transition: background var(--transition-fast);
        }

        #mainContainer {
            background: var(--white);
            border-radius: var(--radius-2xl);
            padding: var(--space-xl) var(--space-2xl);
            width: 100%;
            max-width: 460px;
            transition: max-width 0.35s ease, padding var(--transition-smooth);
            box-shadow: var(--shadow-subtle);
            border: 1px solid var(--border-light);
            position: relative;
        }

        #mainContainer.panel-expanded {
            max-width: 1120px;
            padding: var(--space-2xl);
        }

        .heading-xl {
            font-family: var(--font-heading);
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--text-primary);
        }

        .heading-lg {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .heading-md {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-weight: 700;
        }

        .heading-sm {
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 600;
        }

        .text-body {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .text-caption {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        .text-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }

        .input-field {
            width: 100%;
            padding: 0.85rem 0 0.65rem 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-input);
            font-family: var(--font-body);
            font-size: 0.9rem;
            color: var(--text-primary);
            transition: border-color var(--transition-smooth);
            border-radius: 0;
            outline: none;
        }

        .input-field:focus {
            border-bottom: 1.5px solid var(--sky);
        }

        .input-field::placeholder {
            color: #B0BEC5;
            font-weight: 300;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: var(--font-body);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all var(--transition-fast);
            letter-spacing: 0.01em;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--sky);
            color: var(--white);
            border-radius: var(--radius-lg);
        }

        .btn-primary:hover {
            background: var(--sky-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background: #F1F5F9;
        }

        .btn-danger {
            background: var(--red-soft);
            color: var(--red-text);
            border-radius: var(--radius-md);
        }

        .btn-danger:hover {
            background: #FECACA;
        }

        .btn-success {
            background: var(--green-soft);
            color: var(--green-text);
            border-radius: var(--radius-md);
        }

        .btn-success:hover {
            background: #A7F3D0;
        }

        .btn-warning {
            background: var(--yellow-soft);
            color: var(--yellow-text);
            border-radius: var(--radius-md);
        }

        .btn-warning:hover {
            background: #FDE68A;
        }

        .btn-orange {
            background: var(--orange-soft);
            color: var(--orange-text);
            border-radius: var(--radius-md);
        }

        .btn-orange:hover {
            background: #FED7AA;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn-sm {
            padding: 0.45rem 1rem;
            font-size: 0.75rem;
            border-radius: var(--radius-sm);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
            margin: 1.8rem 0 2rem 0;
        }

        .stat-card {
            background: var(--white);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 1.1rem 0.4rem;
            text-align: center;
            box-shadow: none;
            transition: all var(--transition-fast);
        }

        .stat-card:hover {
            border-color: #CBD5E1;
            background: #FAFBFC;
        }

        .stat-number {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 800;
            color: var(--sky);
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.68rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-top: 0.25rem;
            font-weight: 500;
        }

        .action-row {
            display: flex;
            gap: 0.7rem;
            margin: 1rem 0 1.8rem;
            flex-wrap: wrap;
        }

        .action-pill {
            background: var(--white);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-full);
            padding: 0.65rem 1.6rem;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all var(--transition-smooth);
            color: var(--text-primary);
        }

        .action-pill i {
            font-size: 1.1rem;
            color: var(--sky);
        }

        .action-pill:hover {
            background: var(--sky-soft);
            border-color: var(--sky);
            transform: translateX(3px);
        }

        .nav-row {
            display: flex;
            gap: 0.55rem;
            flex-wrap: wrap;
            margin: 1.6rem 0 1.2rem;
        }

        .user-list-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 0.2rem;
            border-bottom: 1px solid var(--border-light);
            transition: background var(--transition-fast);
            font-size: 0.88rem;
            cursor: pointer;
        }

        .user-list-row:last-child {
            border-bottom: none;
        }

        .user-list-row:hover {
            background: var(--sky-soft);
        }

        .badge {
            font-size: 0.62rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-full);
            display: inline-block;
            letter-spacing: 0.02em;
        }

        .badge-red {
            background: var(--red-soft);
            color: var(--red-text);
        }

        .badge-yellow {
            background: var(--yellow-soft);
            color: var(--yellow-text);
        }

        .badge-orange {
            background: var(--orange-soft);
            color: var(--orange-text);
        }

        .badge-green {
            background: var(--green-soft);
            color: var(--green-text);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: all var(--transition-fast);
            z-index: 100;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-dialog {
            background: var(--white);
            border-radius: var(--radius-2xl);
            padding: var(--space-xl);
            max-width: 440px;
            width: 92%;
            box-shadow: var(--shadow-modal);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.2rem;
            transition: color var(--transition-fast);
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .sub-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-section);
            z-index: 90;
            overflow-y: auto;
            padding: var(--space-lg);
        }

        .sub-panel.active {
            display: block;
        }

        .sub-panel-inner {
            max-width: 640px;
            margin: 0 auto;
        }

        .activity-container {
            max-height: 280px;
            overflow-y: auto;
            margin-top: 0.6rem;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
            color: var(--text-secondary);
            gap: 0.8rem;
        }

        .geo-abstract {
            width: 56px;
            height: 56px;
            border: 2px dashed var(--sky);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            opacity: 0.4;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .flex-center {
            display: flex;
            align-items: center;
        }

        .gap-sm {
            gap: 0.5rem;
        }

        .gap-md {
            gap: 1rem;
        }

        .mt-sm {
            margin-top: 0.6rem;
        }

        .mt-md {
            margin-top: 1rem;
        }

        .mt-lg {
            margin-top: 1.5rem;
        }

        .mt-xl {
            margin-top: 2rem;
        }

        .mb-sm {
            margin-bottom: 0.6rem;
        }

        .mb-md {
            margin-bottom: 1rem;
        }

        .mb-lg {
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .action-row {
                flex-direction: column;
            }

            .action-pill {
                justify-content: center;
            }

            #mainContainer {
                padding: var(--space-lg);
                border-radius: var(--radius-xl);
            }

            #mainContainer.panel-expanded {
                padding: var(--space-lg);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0.6rem;
            }

            .heading-xl {
                font-size: 2rem;
            }

            .heading-lg {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div id="mainContainer">

        <div id="keyScreen">
            <div class="mb-lg">
                <div class="heading-xl">RevanStore</div>
                <div class="text-body mt-sm">Masukkan access key untuk melanjutkan</div>
            </div>
            <div class="input-group mt-xl">
                <label class="input-label">Access Key</label>
                <input type="password" id="accessKey" class="input-field" placeholder="············" autocomplete="off" maxlength="50">
            </div>
            <button class="btn btn-primary btn-block mt-lg" onclick="Auth.verifyKey()">
                Verifikasi <i class="fa-regular fa-arrow-right"></i>
            </button>
        </div>

        <div id="loginScreen" style="display: none;">
            <div class="mb-lg">
                <div class="heading-lg">Admin Login</div>
                <div class="text-body mt-sm">Masukkan kredensial admin</div>
            </div>
            <div class="input-group mt-lg">
                <label class="input-label">Email</label>
                <input type="email" id="loginEmail" class="input-field" placeholder="admin@revanstore.id">
            </div>
            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" id="loginPassword" class="input-field" placeholder="············">
            </div>
            <button class="btn btn-primary btn-block mt-lg" onclick="Auth.login()">
                Masuk <i class="fa-regular fa-arrow-right-to-bracket"></i>
            </button>
        </div>

        <div id="adminPanel" style="display: none;">
            <div class="flex-between mb-lg">
                <div>
                    <span class="heading-lg" style="font-size: 1.5rem;">Dashboard</span>
                    <div class="text-caption" id="loggedUserDisplay">Admin</div>
                </div>
                <button class="btn btn-outline btn-sm" onclick="Auth.logout()">
                    <i class="fa-regular fa-arrow-right-from-bracket"></i> Keluar
                </button>
            </div>

            <div class="stats-grid" id="statsContainer">
                <div class="stat-card">
                    <div class="stat-number" id="statTotal">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="statActive">0</div>
                    <div class="stat-label">Aktif</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="statBanned">0</div>
                    <div class="stat-label">Banned</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="statForce">0</div>
                    <div class="stat-label">Force</div>
                </div>
            </div>

            <div class="action-row">
                <div class="action-pill" onclick="Modal.openAction('ban')">
                    <i class="fa-regular fa-ban"></i> Ban / Unban
                </div>
                <div class="action-pill" onclick="Modal.openAction('banakses')">
                    <i class="fa-regular fa-shield"></i> Ban Akses
                </div>
                <div class="action-pill" onclick="Modal.openAction('force')">
                    <i class="fa-regular fa-circle-stop"></i> Force
                </div>
            </div>

            <div class="nav-row">
                <button class="btn btn-outline btn-sm" onclick="Modal.openAddUser()">
                    <i class="fa-regular fa-user-plus"></i> Tambah User
                </button>
                <button class="btn btn-outline btn-sm" onclick="Navigation.goTo('users')">
                    <i class="fa-regular fa-users"></i> List User
                </button>
                <button class="btn btn-outline btn-sm" onclick="Navigation.goTo('bannedlist')">
                    <i class="fa-regular fa-ban"></i> Banned
                </button>
                <button class="btn btn-outline btn-sm" onclick="Navigation.goTo('banakseslist')">
                    <i class="fa-regular fa-shield-haltered"></i> Ban Akses
                </button>
                <button class="btn btn-outline btn-sm" onclick="Navigation.goTo('suspicious')">
                    <i class="fa-regular fa-triangle-exclamation"></i> Force
                </button>
            </div>

            <div class="mt-xl">
                <div class="heading-sm mb-sm">Aktivitas Terbaru</div>
                <div class="activity-container" id="activityList">
                    <div class="empty-state">
                        <div class="geo-abstract"></div>
                        <span class="text-caption">Memuat data...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="actionModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <span class="heading-md" id="actionModalTitle"></span>
                <button class="modal-close" onclick="Modal.closeAction()">
                    <i class="fa-regular fa-xmark"></i>
                </button>
            </div>
            <div id="actionModalBody"></div>
        </div>
    </div>

    <div class="modal-overlay" id="addUserModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <span class="heading-md">Tambah User Baru</span>
                <button class="modal-close" onclick="Modal.closeAddUser()">
                    <i class="fa-regular fa-xmark"></i>
                </button>
            </div>
            <div class="input-group">
                <label class="input-label">Username</label>
                <input type="text" id="newUsername" class="input-field" placeholder="username" maxlength="30">
            </div>
            <div class="input-group">
                <label class="input-label">Password (min 6 karakter)</label>
                <input type="password" id="newPassword" class="input-field" placeholder="············" maxlength="50">
            </div>
            <div class="input-group">
                <label class="input-label">Nomor HP</label>
                <input type="text" id="newPhone" class="input-field" placeholder="08xxxxxxxxxx" maxlength="20">
            </div>
            <div class="input-group">
                <label class="input-label">Role</label>
                <select id="newRole" class="input-field" style="padding: 0.85rem 0 0.65rem 0; background: transparent; cursor: pointer;">
                    <option>Admin</option>
                    <option selected>Operator</option>
                    <option>User</option>
                    <option>VIP</option>
                    <option>Premium</option>
                    <option>Trial</option>
                </select>
            </div>
            <div class="input-group">
                <label class="input-label">Masa Aktif (MM/DD/YYYY)</label>
                <input type="text" id="newExpiryDate" class="input-field" placeholder="12/31/2099" maxlength="10">
            </div>
            <button class="btn btn-primary btn-block mt-lg" onclick="User.add()">
                <i class="fa-regular fa-user-plus"></i> Tambah User
            </button>
        </div>
    </div>

    <div class="sub-panel" id="subPanel">
        <div class="sub-panel-inner">
            <button class="btn btn-outline btn-sm mb-lg" onclick="Navigation.close()">
                <i class="fa-regular fa-arrow-left"></i> Kembali ke Dashboard
            </button>
            <div id="subPanelContent"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
