<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - RevanStore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --sub: #64748b;
            --border: #e2e8f0;
            --blue: #0ea5e9;
            --red: #ef4444;
            --green: #10b981;
            --yellow: #f59e0b;
            --orange: #f97316;
            --purple: #8b5cf6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #mainContainer {
            background: var(--card);
            border-radius: 18px;
            padding: 28px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
            transition: max-width 0.3s;
        }
        .input-box { margin-bottom: 14px; }
        .input-box label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--sub);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-box input, .input-box select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: #f8fafc;
            font-family: inherit;
            transition: 0.2s;
        }
        .input-box input:focus, .input-box select:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(14,165,233,0.1);
        }
        .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-primary { background: var(--blue); color: #fff; }
        .btn-primary:hover { background: #0284c7; }
        .btn-green { background: var(--green); color: #fff; }
        .btn-green:hover { background: #059669; }
        .btn-red { background: var(--red); color: #fff; }
        .btn-red:hover { background: #dc2626; }
        .btn-yellow { background: var(--yellow); color: #000; }
        .btn-yellow:hover { background: #d97706; }
        .btn-orange { background: var(--orange); color: #fff; }
        .btn-orange:hover { background: #ea580c; }
        .btn-outline {
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover { background: #f1f5f9; }
        .btn-sm { padding: 7px 14px; font-size: 11px; }
        .btn-block { width: 100%; justify-content: center; }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-success { background: var(--green); color: #fff; }
        .btn-warning { background: var(--yellow); color: #000; }

        .logo { text-align: center; font-size: 44px; margin-bottom: 8px; }
        .logo i { color: var(--blue); }
        .title { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .subtitle { text-align: center; font-size: 12px; color: var(--sub); margin-bottom: 20px; }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: #f8fafc;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-number { font-size: 22px; font-weight: 800; color: var(--blue); }
        .stat-label { font-size: 10px; color: var(--sub); margin-top: 2px; }
        
        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .action-card {
            padding: 14px 8px;
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            transition: 0.2s;
            background: #fff;
        }
        .action-card:hover { background: #f0f9ff; border-color: var(--blue); transform: translateY(-2px); }
        .action-card i { font-size: 24px; display: block; margin-bottom: 6px; }
        .action-card.ban-card i { color: var(--red); }
        .action-card.akses-card i { color: var(--yellow); }
        .action-card.force-card i { color: var(--orange); }
        
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .activity-list {
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .activity-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 11px;
            border: 1px solid var(--border);
        }
        .activity-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .activity-dot.login_success { background: var(--green); }
        .activity-dot.login_failed { background: var(--red); }
        .activity-dot.topup { background: var(--blue); }
        .activity-dot.kuras { background: var(--yellow); }
        .activity-dot.gantinama { background: var(--purple); }
        .activity-dot.banned, .activity-dot.ban_akses { background: var(--red); }
        .activity-dot.unbanned, .activity-dot.unban_akses { background: var(--green); }
        .activity-dot.force_logout { background: var(--orange); }
        .activity-dot.unforce_logout { background: var(--green); }
        .activity-dot.sharing_detected { background: var(--red); }
        .activity-info { flex: 1; }
        .activity-user { font-weight: 600; }
        .activity-time { color: var(--sub); font-size: 10px; }
        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--sub);
            font-size: 13px;
        }
        .empty-state i { font-size: 36px; display: block; margin-bottom: 8px; }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
        }
        .badge-red { background: #fee2e2; color: #dc2626; }
        .badge-yellow { background: #fef3c7; color: #d97706; }
        .badge-orange { background: #ffedd5; color: #ea580c; }
        .badge-green { background: #dcfce7; color: #16a34a; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-box {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 16px;
            font-weight: 700;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--sub);
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }
        .detail-label { color: var(--sub); font-weight: 600; }
        .user-check-card {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            transition: 0.15s;
        }
        .user-check-card:hover { background: #f0f9ff; }
        .user-check-card.selected { border-color: var(--blue); background: #e0f2fe; }

        /* Alert */
        .alert-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .alert-overlay.show { visibility: visible; opacity: 1; }
        .alert-popup {
            background: #fff;
            border-radius: 16px;
            padding: 28px 24px;
            text-align: center;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Confirm */
        .confirm-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 150;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .confirm-box {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            width: 90%;
            max-width: 360px;
            text-align: center;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .toggle-row label { font-size: 13px; font-weight: 600; }
        .toggle-switch {
            position: relative;
            width: 48px; height: 26px;
        }
        .toggle-switch input { display: none; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #cbd5e1;
            border-radius: 26px;
            transition: 0.3s;
        }
        .toggle-slider:before {
            content: "";
            position: absolute;
            height: 20px; width: 20px;
            left: 3px; bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-switch input:checked + .toggle-slider { background: var(--blue); }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(22px); }
    </style>
</head>
<body>

<div id="mainContainer">

    <!-- KEY SCREEN -->
    <div id="keyScreen">
        <div class="logo"><i class="fas fa-shield-alt"></i></div>
        <div class="title">Admin Access</div>
        <div class="subtitle">Masukkan key untuk melanjutkan</div>
        <div class="input-box">
            <label><i class="fas fa-key"></i> Access Key</label>
            <input type="password" id="accessKey" placeholder="Masukkan access key..." maxlength="50">
        </div>
        <button class="btn btn-primary btn-block" onclick="verifyKey()">
            <i class="fas fa-arrow-right"></i> Verifikasi
        </button>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" style="display:none;">
        <div class="logo"><i class="fas fa-user-shield"></i></div>
        <div class="title">Admin Login</div>
        <div class="subtitle">Masukkan email & password admin</div>
        <div class="input-box">
            <label><i class="fas fa-envelope"></i> Email</label>
            <input type="email" id="loginEmail" placeholder="admin@email.com">
        </div>
        <div class="input-box">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="loginPassword" placeholder="••••••">
        </div>
        <button class="btn btn-primary btn-block" onclick="login()">
            <i class="fas fa-sign-in-alt"></i> Login
        </button>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" style="display:none;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
            <div>
                <div class="section-title" style="margin:0;"><i class="fas fa-tachometer-alt"></i> Dashboard</div>
                <div style="font-size:11px;color:var(--sub);">Admin: <b id="loggedUser">-</b></div>
            </div>
            <div style="text-align:right;">
                <div id="clockDisplay" style="font-size:13px;font-weight:600;"></div>
                <button class="btn btn-sm btn-outline" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="statTotal">0</div><div class="stat-label"><i class="fas fa-users"></i> Total</div></div>
            <div class="stat-card"><div class="stat-number" id="statActive">0</div><div class="stat-label"><i class="fas fa-check-circle"></i> Aktif</div></div>
            <div class="stat-card"><div class="stat-number" id="statBanned">0</div><div class="stat-label"><i class="fas fa-ban"></i> Banned</div></div>
            <div class="stat-card"><div class="stat-number" id="statForce">0</div><div class="stat-label"><i class="fas fa-eject"></i> Force</div></div>
        </div>

        <!-- ACTION BUTTONS (3 FITUR UTAMA) -->
        <div class="section-title"><i class="fas fa-bolt"></i> Quick Actions</div>
        <div class="action-grid">
            <div class="action-card ban-card" onclick="openActionModal('ban')">
                <i class="fas fa-ban"></i> Ban / Unban
            </div>
            <div class="action-card akses-card" onclick="openActionModal('banakses')">
                <i class="fas fa-shield-haltered"></i> Ban Akses
            </div>
            <div class="action-card force-card" onclick="openActionModal('force')">
                <i class="fas fa-eject"></i> Force
            </div>
        </div>

        <!-- NAVIGATION -->
        <div class="nav-grid">
            <button class="btn btn-green btn-block" onclick="openAddUserModal()"><i class="fas fa-user-plus"></i> Tambah User</button>
            <button class="btn btn-outline btn-block" onclick="navigateTo('users')"><i class="fas fa-users"></i> List User</button>
            <button class="btn btn-outline btn-block" onclick="navigateTo('bannedlist')"><i class="fas fa-ban"></i> List Banned</button>
            <button class="btn btn-outline btn-block" onclick="navigateTo('banakseslist')"><i class="fas fa-shield"></i> List Ban Akses</button>
            <button class="btn btn-outline btn-block" onclick="navigateTo('suspicious')"><i class="fas fa-exclamation-triangle"></i> List Force</button>
        </div>

        <!-- ACTIVITY -->
        <div class="section-title"><i class="fas fa-history"></i> Aktivitas Terbaru</div>
        <div class="activity-list" id="activityListContainer">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>
        </div>
    </div>
</div>

<!-- ALERT OVERLAY -->
<div class="alert-overlay" id="alertOverlay">
    <div class="alert-popup">
        <div id="alertIcon" style="margin-bottom:12px;"></div>
        <div id="alertTitle" style="font-size:16px;font-weight:700;margin-bottom:6px;"></div>
        <div id="alertMessage" style="font-size:13px;color:var(--sub);"></div>
    </div>
</div>

<!-- CONFIRM OVERLAY -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <div id="confirmMessage" style="margin-bottom:16px;font-size:14px;"></div>
        <div style="display:flex;gap:8px;justify-content:center;">
            <button class="btn btn-danger" id="confirmYes"><i class="fas fa-check"></i> Ya</button>
            <button class="btn btn-outline" id="confirmNo"><i class="fas fa-times"></i> Batal</button>
        </div>
    </div>
</div>

<!-- ACTION MODAL -->
<div class="modal-overlay" id="actionModal">
    <div class="modal-box">
        <div class="modal-header">
            <span id="actionModalTitle"></span>
            <button class="modal-close" id="closeActionModalBtn"><i class="fas fa-times"></i></button>
        </div>
        <div id="actionModalBody"></div>
    </div>
</div>

<!-- ADD USER MODAL -->
<div class="modal-overlay" id="addUserModal">
    <div class="modal-box">
        <div class="modal-header">
            <span><i class="fas fa-user-plus"></i> Tambah User</span>
            <button class="modal-close" onclick="closeAddUserModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="input-box"><label>Username *</label><input type="text" id="newUsername" placeholder="Username..." maxlength="30"></div>
        <div class="input-box"><label>Password * (min 6)</label><input type="password" id="newPassword" placeholder="Password..." maxlength="50"></div>
        <div class="input-box"><label>Nomor</label><input type="text" id="newPhone" placeholder="Nomor HP..." maxlength="20"></div>
        <div class="input-box"><label>Role</label><select id="newRole"><option>Admin</option><option selected>Operator</option><option>User</option><option>VIP</option><option>Premium</option><option>Trial</option></select></div>
        <div class="input-box"><label>Masa Aktif (MM/DD/YYYY)</label><input type="text" id="newExpiryDate" maxlength="10"></div>
        <button class="btn btn-green btn-block" onclick="addUserNow()"><i class="fas fa-user-plus"></i> Tambah</button>
    </div>
</div>

<!-- EDIT USER MODAL -->
<div class="modal-overlay" id="editUserModal">
    <div class="modal-box">
        <div class="modal-header">
            <span><i class="fas fa-edit"></i> Edit User</span>
            <button class="modal-close" id="closeEditModalBtn"><i class="fas fa-times"></i></button>
        </div>
        <input type="hidden" id="editUserId">
        <div class="input-box"><label>Username</label><input type="text" id="editUsername" maxlength="30"></div>
        <div class="input-box"><label>Password (kosongkan jika tidak diubah)</label><input type="password" id="editPassword" placeholder="••••••" maxlength="50"></div>
        <div class="input-box"><label>Nomor</label><input type="text" id="editPhone" maxlength="20"></div>
        <div class="input-box"><label>Role</label><select id="editRole"><option>Admin</option><option>Operator</option><option>User</option><option>VIP</option><option>Premium</option><option>Trial</option></select></div>
        <div class="input-box"><label>Masa Aktif (MM/DD/YYYY)</label><input type="text" id="editExpiryDate" maxlength="10"></div>
        <div class="input-box"><label>IP</label><input type="text" id="editIP" readonly style="background:#f1f5f9;"></div>
        <div class="input-box"><label>Fingerprint</label><input type="text" id="editFP" readonly style="background:#f1f5f9;"></div>
        <button class="btn btn-primary btn-block" onclick="saveUserEdit()"><i class="fas fa-save"></i> Simpan</button>
    </div>
</div>

<!-- SUB PANEL -->
<div id="subPanel" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#f8fafc;z-index:50;overflow-y:auto;padding:20px;">
    <div style="max-width:600px;margin:0 auto;">
        <button class="btn btn-sm btn-outline" onclick="closeSubPanel()" style="margin-bottom:14px;">
            <i class="fas fa-arrow-left"></i> Kembali ke Beranda
        </button>
        <div id="subPanelContent"></div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
