<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#00bfff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body oncontextmenu="return false">

<div class="alert-overlay" id="alertOverlay">
    <div class="alert-box">
        <div id="alertIcon"></div>
        <div id="alertTitle"></div>
        <div id="alertMessage"></div>
    </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <div class="confirm-icon">⚠️</div>
        <p class="confirm-message" id="confirmMessage"></p>
        <div class="confirm-buttons">
            <button class="confirm-btn confirm-no" id="confirmNo">Batal</button>
            <button class="confirm-btn confirm-yes" id="confirmYes">Ya</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Edit User</div>
            <button class="close-modal" onclick="closeEditModal()">&times;</button>
        </div>
        <input type="hidden" id="editUserId">
        <div class="input-box"><label>Username</label><input type="text" id="editUsername" maxlength="30"></div>
        <div class="input-box"><label>Nomor (WA/Telepon)</label><input type="text" id="editPhone" maxlength="20" placeholder="08123456789"></div>
        <div class="input-box"><label>Password (kosongkan jika tidak diubah)</label><input type="password" id="editPassword" placeholder="min 6 karakter" maxlength="50"></div>
        <div class="input-box"><label>Role</label><select id="editRole"><option>Admin</option><option selected>Operator</option><option>User</option><option>VIP</option><option>Premium</option><option>Trial</option></select></div>
        <div class="input-box"><label>Masa Aktif (MM/DD/YYYY)</label><input type="text" id="editExpiryDate" placeholder="01/28/2026" maxlength="10">
            <div class="quick-dates">
                <span class="date-chip" onclick="setQuickDate('edit','permanent')">Permanent</span>
                <span class="date-chip" onclick="setQuickDate('edit','week')">+1 Minggu</span>
                <span class="date-chip" onclick="setQuickDate('edit','month')">+1 Bulan</span>
                <span class="date-chip" onclick="setQuickDate('edit','year')">+1 Tahun</span>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-green" style="flex:1" onclick="saveUserChanges()">Simpan</button>
            <button class="btn" style="flex:1;background:#f1f5f9;color:#64748b" onclick="closeEditModal()">Batal</button>
        </div>
    </div>
</div>

<div class="container" id="mainContainer" style="max-width:440px">

    <!-- KEY SCREEN -->
    <div id="keyScreen">
        <div class="header">
            <div><h1>Panel Admin</h1><div class="subtitle">Verifikasi Akses</div></div>
        </div>
        <div class="content">
            <div class="input-box"><label>Masukkan Key Akses</label><input type="password" id="accessKey" placeholder="Masukkan key..." maxlength="50"></div>
            <button class="btn btn-primary btn-block" onclick="verifyKey()">Verifikasi</button>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" style="display:none">
        <div class="header">
            <div><h1>Panel Admin</h1><div class="subtitle">Login</div></div>
        </div>
        <div class="content">
            <div class="input-box"><label>Email</label><input type="email" id="loginEmail" placeholder="Masukkan email" maxlength="50"></div>
            <div class="input-box"><label>Password</label><input type="password" id="loginPassword" placeholder="Masukkan password" maxlength="50"></div>
            <button class="btn btn-primary btn-block" onclick="login()">Masuk</button>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" style="display:none">
        <div class="header">
            <div><h1>Panel Admin</h1><div class="subtitle"><span id="loggedUser">-</span></div></div>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Keluar</button>
        </div>
        <div class="content">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('adduser')">➕ Tambah</button>
                <button class="tab" onclick="switchTab('users')">👥 User <span class="counter-badge" id="userCount">0</span></button>
                <button class="tab" onclick="switchTab('banned')">🚫 Banned <span class="counter-badge" id="bannedCount" style="background:#ef4444">0</span></button>
                <button class="tab" onclick="switchTab('blocked')">🌐 IP <span class="counter-badge" id="blockedCount">0</span></button>
            </div>

            <div id="adduser" class="tab-content active">
                <div class="input-box"><label>Username</label><input type="text" id="newUser" placeholder="operator1" maxlength="30"></div>
                <div class="input-box"><label>Nomor (WA/Telepon)</label><input type="text" id="newPhone" placeholder="08123456789" maxlength="20"></div>
                <div class="input-box"><label>Password (min 6 karakter)</label><input type="password" id="newPass" placeholder="min 6 karakter" maxlength="50"></div>
                <div class="input-box"><label>Role</label><select id="newRole"><option>Admin</option><option selected>Operator</option><option>User</option><option>VIP</option><option>Premium</option><option>Trial</option></select></div>
                <div class="input-box"><label>Masa Aktif (MM/DD/YYYY)</label><input type="text" id="newExpiryDate" placeholder="01/28/2026" maxlength="10">
                    <div class="quick-dates">
                        <span class="date-chip" onclick="setQuickDate('new','permanent')">Permanent</span>
                        <span class="date-chip" onclick="setQuickDate('new','week')">+1 Minggu</span>
                        <span class="date-chip" onclick="setQuickDate('new','month')">+1 Bulan</span>
                        <span class="date-chip" onclick="setQuickDate('new','year')">+1 Tahun</span>
                    </div>
                </div>
                <button class="btn btn-green btn-block" onclick="addUserNow()"><i class="fas fa-plus"></i> Tambah User</button>
            </div>

            <div id="users" class="tab-content">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px">
                    <div style="display:flex;gap:5px;flex-wrap:wrap">
                        <button class="btn-sm btn-primary" onclick="loadUsers()"><i class="fas fa-sync-alt"></i> Refresh</button>
                        <button class="btn-sm btn-green" onclick="switchTab('adduser')"><i class="fas fa-plus"></i> Tambah</button>
                        <button class="btn-sm btn-purple" onclick="setAllUsersPermanent()"><i class="fas fa-infinity"></i> Set Permanent</button>
                    </div>
                    <span style="font-size:11px;color:#64748b">Total: <b id="totalUsers" style="color:#0f172a">0</b></span>
                </div>
                <div class="search-box"><input type="text" id="searchUser" placeholder="Cari user..." onkeyup="searchUsers()"></div>
                <div class="user-list" id="userListContainer"><div style="text-align:center;padding:40px;color:#64748b">Memuat data...</div></div>
            </div>

            <div id="banned" class="tab-content">
                <div style="display:flex;gap:5px;margin-bottom:12px"><button class="btn-sm btn-primary" onclick="loadUsers()"><i class="fas fa-sync-alt"></i> Refresh</button></div>
                <div class="user-list" id="bannedListContainer"><div style="text-align:center;padding:40px;color:#64748b">Memuat data...</div></div>
            </div>

            <div id="blocked" class="tab-content">
                <div style="display:flex;gap:5px;margin-bottom:12px"><button class="btn-sm btn-primary" onclick="loadBlockedIPs()"><i class="fas fa-sync-alt"></i> Refresh</button></div>
                <div class="search-box"><input type="text" id="searchBlocked" placeholder="Cari IP..." onkeyup="searchBlocked()"></div>
                <div class="user-list" id="blockedListContainer"><div style="text-align:center;padding:40px;color:#64748b">Memuat data...</div></div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="main.js"></script>
</body>
</html>
